services:
  - type: web
    name: candidate-eval-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_AGENTS
        value: qwen/qwen3.8-27b
      - key: GROQ_MODEL_JUDGE
        value: qwen/qwen3.8-27b
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_URL
        value: https://api.sarvam.ai/text-to-speech
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/evaluations.db
      - key: UPLOAD_DIR
        value: data/uploads
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: LOG_LEVEL
        value: INFO
