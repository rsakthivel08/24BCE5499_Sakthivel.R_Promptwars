<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluation Results — MultiAgent Eval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="inner">
      <div class="logo"><a href="/" style="color:inherit; text-decoration:none;">Multi<span>Agent</span> Eval</a></div>
      <div id="evalStatus"></div>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Loading state -->
      <div id="loadingState" class="card" style="text-align:center; padding:60px;">
        <div class="spinner" style="width:40px;height:40px;border-width:3px;margin:0 auto 20px;"></div>
        <div style="font-size:1.1rem; font-weight:600;" id="loadingMsg">Running evaluation pipeline...</div>
        <div class="text-muted mt-8" id="loadingSubMsg">This takes 1–3 minutes. The agents are debating.</div>
        <div class="progress-bar-wrap" style="max-width:400px;margin:20px auto 0;">
          <div class="progress-bar" id="loadingBar" style="width:5%;"></div>
        </div>
      </div>

      <!-- Results (hidden until ready) -->
      <div id="resultsState" style="display:none;">
        <!-- Candidate header -->
        <div class="card" id="candidateHeader">
          <div class="profile-header">
            <div class="avatar" id="avatarInitial">?</div>
            <div>
              <div class="profile-name" id="candidateName">Loading...</div>
              <div class="profile-role" id="candidateRole"></div>
            </div>
            <div style="margin-left:auto;">
              <div id="recommendationBadge"></div>
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="profile">👤 Profile</button>
          <button class="tab-btn" data-tab="opinions">🤖 Agent Opinions</button>
          <button class="tab-btn" data-tab="debate">⚔️ Debate</button>
          <button class="tab-btn" data-tab="report">⚖️ Final Report</button>
          <button class="tab-btn" data-tab="voice">🎙️ Voice Debate</button>
        </div>

        <!-- Tab: Profile -->
        <div class="tab-panel active" id="tab-profile">
          <div id="profileContent"></div>
        </div>

        <!-- Tab: Opinions -->
        <div class="tab-panel" id="tab-opinions">
          <div id="opinionsContent"></div>
        </div>

        <!-- Tab: Debate -->
        <div class="tab-panel" id="tab-debate">
          <div id="debateContent"></div>
        </div>

        <!-- Tab: Final Report -->
        <div class="tab-panel" id="tab-report">
          <div id="reportContent"></div>
        </div>

        <!-- Tab: Voice Debate -->
        <div class="tab-panel" id="tab-voice">
          <div id="voiceContent"></div>
        </div>
      </div>

      <!-- Error state -->
      <div id="errorState" style="display:none;" class="card">
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <div style="font-weight:600; margin-bottom:8px;" id="errorTitle">Evaluation Failed</div>
          <div class="text-muted" id="errorDetail"></div>
          <a href="/" class="btn btn-secondary" style="margin-top:20px; display:inline-flex;">← Try Again</a>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/opinions.js"></script>
  <script src="/js/debate.js"></script>
  <script src="/js/report.js"></script>
  <script src="/js/voice.js"></script>
  <script>
    // ── Bootstrap: get evaluation_id from URL and start polling ──
    const params = new URLSearchParams(window.location.search);
    const evalId = params.get('id');
    if (!evalId) {
      window.location.href = '/';
    } else {
      initResultsPage(evalId);
    }

    async function initResultsPage(id) {
      // First trigger the evaluation
      try {
        await api.post(`/api/evaluate/${id}`);
      } catch(e) {
        // 409 = already running, that's fine
        if (!e.message?.includes('409') && !e.message?.includes('complete')) {
          showError('Failed to start evaluation', e.message);
          return;
        }
      }
      pollStatus(id);
    }

    let pollInterval;
    let dotCount = 0;
    const phaseMessages = [
      [5,  'Building candidate profile...'],
      [20, 'Running Technical Agent evaluation...'],
      [35, 'Running HR Agent evaluation...'],
      [50, 'Running Hiring Manager Agent evaluation...'],
      [65, 'Running Skeptic Agent evaluation...'],
      [75, 'Agents are debating...'],
      [85, 'Round 2: Agents responding to challenges...'],
      [92, 'Judge Agent composing final recommendation...'],
      [98, 'Saving results...'],
    ];
    let phaseIdx = 0;

    function advanceProgress() {
      const bar = document.getElementById('loadingBar');
      const msg = document.getElementById('loadingMsg');
      if (phaseIdx < phaseMessages.length) {
        bar.style.width = phaseMessages[phaseIdx][0] + '%';
        msg.textContent = phaseMessages[phaseIdx][1];
        phaseIdx++;
      }
    }

    async function pollStatus(id) {
      advanceProgress();
      pollInterval = setInterval(async () => {
        advanceProgress();
        try {
          const data = await api.get(`/api/status/${id}`);
          if (data.status === 'complete') {
            clearInterval(pollInterval);
            document.getElementById('loadingBar').style.width = '100%';
            setTimeout(() => loadResults(id), 500);
          } else if (data.status === 'error') {
            clearInterval(pollInterval);
            showError('Evaluation failed', data.error || 'Unknown error');
          }
        } catch(e) {
          // keep polling
        }
      }, 6000);
    }

    async function loadResults(id) {
      try {
        const data = await api.get(`/api/results/${id}`);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('resultsState').style.display = 'block';

        const profile = data.candidate_profile || {};
        const name = profile.candidate_name || 'Unknown Candidate';
        document.getElementById('candidateName').textContent = name;
        document.getElementById('candidateRole').textContent = profile.education?.degree || '';
        document.getElementById('avatarInitial').textContent = name[0]?.toUpperCase() || '?';

        const report = data.final_report || {};
        document.getElementById('evalStatus').innerHTML =
          `<span class="status-badge badge-complete">✓ Complete</span>`;
        if (report.final_recommendation) {
          document.getElementById('recommendationBadge').innerHTML =
            `<span class="status-badge badge-complete" style="font-size:0.85rem;">${report.final_recommendation}</span>`;
        }

        // Render each tab
        renderProfile(profile);
        renderOpinions(data.opinions || []);
        renderDebate(data.debate_turns || []);
        renderReport(report);
        initVoiceTab(id);

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
          });
        });

      } catch(e) {
        showError('Failed to load results', e.message);
      }
    }

    function showError(title, detail) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorDetail').textContent = detail || '';
    }
  </script>
</body>
</html>
